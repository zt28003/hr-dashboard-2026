const N=n=>n==null?'0':n.toLocaleString();

function aggregate(arr){
if(arr.length===1)return arr[0];
const a={start:0,hire:0,leave:0,transfer:0,net:0,end:0,perf_high:0,perf_mid:0,perf_low:0,perf_none:0,talent_high:0,talent_stable:0,talent_follow:0,talent_none:0,tenure_probation:0,tenure_0_1:0,tenure_1_3:0,tenure_3_5:0,tenure_5plus:0,reasonsMap:{}};
arr.forEach(d=>{
a.start+=d.start;a.hire+=d.hire;a.leave+=d.leave;a.transfer+=d.transfer;a.net+=d.net;a.end+=d.end;
a.perf_high+=d.perf_high;a.perf_mid+=d.perf_mid;a.perf_low+=d.perf_low;a.perf_none+=d.perf_none;
a.talent_high+=d.talent_high;a.talent_stable+=d.talent_stable;a.talent_follow+=d.talent_follow;a.talent_none+=d.talent_none;
a.tenure_probation+=d.tenure_probation;a.tenure_0_1+=d.tenure_0_1;a.tenure_1_3+=d.tenure_1_3;a.tenure_3_5+=d.tenure_3_5;a.tenure_5plus+=d.tenure_5plus;
(d.reasons||[]).forEach(r=>{a.reasonsMap[r.name]=(a.reasonsMap[r.name]||0)+r.count;});
});
const tLeave=a.leave;
const perfTotal=a.perf_high+a.perf_mid+a.perf_low+a.perf_none||1;
const talentTotal=a.talent_high+a.talent_stable+a.talent_follow+a.talent_none||1;
const tenureTotal=a.tenure_probation+a.tenure_0_1+a.tenure_1_3+a.tenure_3_5+a.tenure_5plus||1;
a.turnover_rate=tLeave>0?Math.round(tLeave/(tLeave+a.end)*1000)/10:0;
a.perf_high_pct=Math.round(a.perf_high/perfTotal*1000)/10;
a.perf_mid_pct=Math.round(a.perf_mid/perfTotal*1000)/10;
a.perf_low_pct=Math.round(a.perf_low/perfTotal*1000)/10;
a.perf_none_pct=Math.round(a.perf_none/perfTotal*1000)/10;
a.talent_high_pct=Math.round(a.talent_high/talentTotal*1000)/10;
a.talent_stable_pct=Math.round(a.talent_stable/talentTotal*1000)/10;
a.talent_follow_pct=Math.round(a.talent_follow/talentTotal*1000)/10;
a.talent_none_pct=Math.round(a.talent_none/talentTotal*1000)/10;
a.tenure_probation_pct=Math.round(a.tenure_probation/tenureTotal*1000)/10;
a.tenure_0_1_pct=Math.round(a.tenure_0_1/tenureTotal*1000)/10;
a.tenure_1_3_pct=Math.round(a.tenure_1_3/tenureTotal*1000)/10;
a.tenure_3_5_pct=Math.round(a.tenure_3_5/tenureTotal*1000)/10;
a.tenure_5plus_pct=Math.round(a.tenure_5plus/tenureTotal*1000)/10;
a.reasons=Object.keys(a.reasonsMap).map(k=>({name:k,count:a.reasonsMap[k],pct:Math.round(a.reasonsMap[k]/(tLeave||1)*1000)/10})).sort((x,y)=>y.count-x.count);
return a;
}

function getSelected(){
const sel=[...selectedBUs];
if(sel.includes('all'))return{data:D.total,label:'全部'};
const arr=sel.map(n=>D.departments.find(d=>d.name===n)).filter(Boolean).map(d=>d.summary);
return{data:arr.length?aggregate(arr):D.total,label:sel.join(' + ')};
}

function renderKPI(d){
d=d||getSelected().data;
const g=document.getElementById('kpiGrid');
const items=[
{l:'26年年初人数',v:N(d.start),s:'1月1日在职'},
{l:'26年入职人数',v:N(d.hire),s:'截至4月30日'},
{l:'26年离职人数',v:N(d.leave),s:'截至4月30日'},
{l:'净增人数',v:(d.net>=0?'+':'')+N(d.net),s2:'净增=入职-离职-调出',s:'调出=正式工转非正式工'},
{l:'期末在职人数',v:N(d.end),s:'截至4月30日'},
{l:'离职率',v:R(d.turnover_rate),s:'离职/(离职+期末在职)',red:true}
];
g.innerHTML=items.map(i=>'<div class="kpi-card"><div class="kpi-label">'+i.l+'</div><div class="kpi-value"'+(i.red?' style="background:none;-webkit-text-fill-color:#ef5350"':'')+'>'+i.v+'</div>'+(i.s2?'<div class="kpi-sub">'+i.s2+'</div>':'')+'<div class="kpi-sub">'+i.s+'</div></div>').join('');
}

function mkChart(id,type,labels,values,colors){
const ctx=document.getElementById(id).getContext('2d');
if(CH[id])CH[id].destroy();
CH[id]=new Chart(ctx,{
type,data:{labels,datasets:[{data:values,backgroundColor:colors,borderColor:'rgba(0,0,0,.1)',borderWidth:2,hoverOffset:8}]},
options:{responsive:true,maintainAspectRatio:false,cutout:'40%',plugins:{legend:{position:'right',labels:{color:'#90b4d4',font:{size:12},padding:12,usePointStyle:true}},tooltip:{callbacks:{label:function(c){const t=c.dataset.data.reduce((a,b)=>a+b,0);const p=t>0?(c.parsed/t*100).toFixed(1):0;return c.label+': '+c.parsed+'人 ('+p+'%)'}}},datalabels:{color:'#fff',font:{size:11,weight:'bold'},textAlign:'center',formatter:function(v,ctx){const t=ctx.dataset.data.reduce((a,b)=>a+b,0);const p=t>0?(v/t*100).toFixed(1):0;return v+'人\n('+p+'%)';},display:function(ctx){return ctx.dataset.data[ctx.dataIndex]>0;}}}},animation:{animateRotate:true,duration:800},plugins:[ChartDataLabels]});
}

function mkBar(id,labels,values,pcts,colors){
const ctx=document.getElementById(id).getContext('2d');
if(CH[id])CH[id].destroy();
const combined=labels.map((l,i)=>({l,v:values[i],p:pcts[i],c:colors[i]})).sort((a,b)=>b.v-a.v);
const sLabels=combined.map(x=>x.l),sValues=combined.map(x=>x.v),sPcts=combined.map(x=>x.p),sColors=combined.map(x=>x.c);
CH[id]=new Chart(ctx,{
type:'bar',data:{labels:sLabels,datasets:[{label:'人数',data:sValues,backgroundColor:sColors.map(c=>c+'cc'),borderColor:sColors,borderWidth:1,borderRadius:4}]},
options:{responsive:true,maintainAspectRatio:false,indexAxis:'y',layout:{padding:{right:80}},plugins:{legend:{display:false},tooltip:{callbacks:{label:function(c){return c.parsed.x+'人 ('+(sPcts[c.dataIndex]||0)+'%)'}}}},scales:{x:{grid:{color:'rgba(100,150,255,.08)'},ticks:{color:'#7eb8e0'}},y:{grid:{display:false},ticks:{color:'#90b4d4',font:{size:10},autoSkip:false,maxTicksLimit:50}}},animation:{duration:800}},
plugins:[{afterDatasetsDraw:function(chart){
const ctx2=chart.ctx;
chart.data.datasets[0].data.forEach((val,i)=>{
const meta=chart.getDatasetMeta(0);const bar=meta.data[i];
ctx2.fillStyle='#b0d0f0';ctx2.font='12px sans-serif';ctx2.textAlign='left';ctx2.textBaseline='middle';
ctx2.fillText(val+'人 ('+(sPcts[i]||0)+'%)',bar.x+6,bar.y);
});
}}]
});
}

document.getElementById('t5').innerHTML=lb+' - 主动/被动离职 <span style="background:rgba(66,165,245,.2);color:#64b5f6;padding:2px 8px;border-radius:4px;font-size:12px;font-weight:400">离职原因分布</span>';
const passive=['能力不足','人员优化','工作态度','协商一致'];
let passiveCount=0,activeCount=0;
d.reasons.forEach(r=>{if(passive.includes(r.name))passiveCount+=r.count;else activeCount+=r.count;});
mkChart('c5','doughnut',['主动离职','被动离职'],[activeCount,passiveCount],['#42a5f5','#ef5350']);

function initTabs(){
const bar=document.getElementById('deptTabs');
const allNames=['all',...D.departments.map(d=>d.name)];
const allLabels=['全部',...D.departments.map(d=>d.name)];
allNames.forEach((name,i)=>{
const btn=document.createElement('button');
btn.className='tab-btn'+(i===0?' active':'');
btn.textContent=allLabels[i];
btn.dataset.value=name;
btn.onclick=function(){
const v=this.dataset.value;
if(v==='all'){
selectedBUs.clear();selectedBUs.add('all');
document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
this.classList.add('active');
}else{
selectedBUs.delete('all');
document.querySelector('.tab-btn[data-value="all"]').classList.remove('active');
if(this.classList.contains('active')){this.classList.remove('active');selectedBUs.delete(v);}
else{this.classList.add('active');selectedBUs.add(v);}
if(selectedBUs.size===0){selectedBUs.add('all');document.querySelector('.tab-btn[data-value="all"]').classList.add('active');}
}
refreshAll();
};
bar.appendChild(btn);
});
}

const dept2Id=dept.name+'_d2_'+i;

h+='<tr class="dept2-row" data-dept2="'+dept2Id+'" data-parent-bu="'+dept.name+'" onclick="event.stopPropagation();toggleRow(this)">';
h+='<td></td>';
h+='<td>'+(hasSubs3?'<span class="expand-icon">&#9654;</span>':'<span style="display:inline-block;width:16px">&nbsp;</span>')+'<span style="font-weight:600;color:#90b4d4">'+d2.name+'</span></td>';
h+='<td></td>';
h+='<td>'+N(s2.start)+'</td><td>'+N(s2.hire)+'</td><td>'+N(s2.leave)+'</td><td>'+(s2.net>=0?'+':'')+N(s2.net)+'</td><td>'+N(s2.end)+'</td>';
h+='<td'+'>'+R(s2.turnover_rate)+'</td></tr>';
if(hasSubs3){
d2.dept3.forEach(d3=>{
h+='<tr class="dept3-row" data-parent-dept2="'+dept2Id+'">';
h+='<td></td><td></td>';
h+='<td>'+d3.name+'</td>';
h+='<td>'+N(d3.start)+'</td><td>'+N(d3.hire)+'</td><td>'+N(d3.leave)+'</td><td>'+(d3.net>=0?'+':'')+N(d3.net)+'</td><td>'+N(d3.end)+'</td>';
h+='<td>'+R(d3.turnover_rate)+'</td></tr>';
});
}
});
}
});
tb.innerHTML=h;
}
function toggleRow(row){
row.classList.toggle('expanded');
const icon=row.querySelector('.expand-icon');
if(icon)icon.innerHTML=row.classList.contains('expanded')?'&#9660;':'&#9654;';
const bu=row.dataset.bu;
const dept2=row.dataset.dept2;
const tb=document.getElementById('tblBody');
if(bu){
const subs=tb.querySelectorAll('.dept2-row[data-parent-bu="'+bu+'"]');
subs.forEach(r=>r.classList.toggle('show'));
}else if(dept2){
const subs=tb.querySelectorAll('.dept3-row[data-parent-dept2="'+dept2+'"]');
subs.forEach(r=>r.classList.toggle('show'));
}
}

function renderSummary(){
const t=D.total;
const depts=[...D.departments].filter(d=>d.summary).sort((a,b)=>b.summary.turnover_rate-a.summary.turnover_rate);
const topRates=depts.slice(0,3);
const lowRates=[...depts].sort((a,b)=>a.summary.turnover_rate-b.summary.turnover_rate).slice(0,3);
const biggest=[...depts].sort((a,b)=>b.summary.end-a.summary.end);
const passiveTotal=t.reasons.filter(r=>['能力不足','人员优化','工作态度','协商一致'].includes(r.name)).reduce((s,r)=>s+r.count,0);
const activeTotal=t.leave-passiveTotal;
const probPct=(t.tenure_probation/t.leave*100).toFixed(0);
const devPct=((t.reasons.find(r=>r.name==='发展因素')||{}).count/t.leave*100).toFixed(0);
const top3Pct=(biggest.slice(0,3).reduce((s,d)=>s+d.summary.end,0)/t.end*100).toFixed(0);
const abuDept=depts.find(d=>d.name==='ABU');
const gusDept=depts.find(d=>d.name==='GUS');
const h=[
'<div style="margin-bottom:20px">',
'<div style="font-size:16px;font-weight:600;color:#64b5f6;margin-bottom:12px;border-left:3px solid #42a5f5;padding-left:10px">一、核心数据概览</div>',
'<p>截至2026年4月30日，集团正式工<b>期末在职 '+N(t.end)+' 人</b>，较年初（'+N(t.start)+'人）<b style="color:'+(t.net>=0?'#66bb6a':'#ef5350')+'">▲ 净增 '+(t.net>=0?'+':'')+N(t.net)+' 人</b>。',
'累计入职 '+N(t.hire)+' 人，累计离职 '+N(t.leave)+' 人（主动 '+activeTotal+' / 被动 '+passiveTotal+'），',
'整体离职率 <b style="color:#ef5350">'+R(t.turnover_rate)+'</b>。</p>',
'<p style="margin-top:8px"><b>◆ 试用期内离职 '+N(t.tenure_probation)+' 人</b>（占离职总数 '+probPct+'%），为最大离职群体；',
'离职首要原因为<b>发展因素</b>（'+N((t.reasons.find(r=>r.name==='发展因素')||{}).count||0)+'人 / '+devPct+'%），其次为能力不足（'+N((t.reasons.find(r=>r.name==='能力不足')||{}).count||0)+'人）。</p>',
'</div>',
'<div style="margin-bottom:20px">',
'<div style="font-size:16px;font-weight:600;color:#64b5f6;margin-bottom:12px;border-left:3px solid #42a5f5;padding-left:10px">二、BU维度分析</div>',
'<p><b style="color:#ef5350">■ 离职率前三</b>：'+topRates.map(d=>d.name+' <b style="color:#ef5350">'+R(d.summary.turnover_rate)+'</b>').join(' &nbsp;|&nbsp; ')+'。',
'离职率最低：'+lowRates.map(d=>d.name+' <b>'+R(d.summary.turnover_rate)+'</b>').join(' &nbsp;|&nbsp; ')+'。</p>',
'<p style="margin-top:8px"><b>■ 人员规模前三</b>：'+biggest.slice(0,3).map(d=>d.name+'（<b>'+N(d.summary.end)+'</b> 人）').join(' &nbsp;|&nbsp; ')+'，',
'三BU合计占集团总人数 <b>'+top3Pct+'%</b>。</p>',
'<p style="margin-top:8px">ABU航空事业部离职率最高（'+R(abuDept.summary.turnover_rate)+'），主要受<b>能力不足</b>因素驱动（占其离职人数 '+(abuDept.summary.reasons.find(r=>r.name==='能力不足')||{}).pct+'%），建议关注招聘质量与试用期带教培训。',
'GUS美洲区入职 '+N(gusDept.summary.hire)+' 人为各BU之首，净增 '+N(gusDept.summary.net)+' 人，规模快速扩张中需同步关注人员留存。</p>',
'</div>',
'<div>',
'<div style="font-size:16px;font-weight:600;color:#64b5f6;margin-bottom:12px;border-left:3px solid #42a5f5;padding-left:10px">三、管理建议</div>',
'<p><b>◆ 试用期留存</b>：试用期离职占离职总数 '+probPct+'%，建议强化入职90天融入计划，建立导师带教与定期面谈机制。</p>',
'<p><b>◆ 发展通道建设</b>：发展因素为第一大离职原因（'+devPct+'%），建议完善内部职级晋升体系与转岗机制，为员工提供清晰的成长路径。</p>',
'<p><b>◆ ABU专项管控</b>：ABU离职率 '+R(abuDept.summary.turnover_rate)+' 远超集团均值（'+R(t.turnover_rate)+'），且能力不足被动离职占比近六成，建议从招聘标准、岗前技能认证、试用期考核三端联动改进。</p>',
'<p><b>◆ GUS扩张节奏</b>：美洲区入职 '+N(gusDept.summary.hire)+' 人居各BU之首，需同步评估管理幅度与HRBP配比，防止规模扩张带来管理稀释。</p>',
'</div>'
];
document.getElementById('summaryBody').innerHTML=h.join('');
}

function expandAll(){
const tb=document.getElementById('tblBody');
const dept2Rows=tb.querySelectorAll('.dept2-row');
const dept3Rows=tb.querySelectorAll('.dept3-row');
const buRows=tb.querySelectorAll('.bu-row');
dept2Rows.forEach(r=>r.classList.add('show'));
dept3Rows.forEach(r=>r.classList.add('show'));
buRows.forEach(r=>{r.classList.add('expanded');const icon=r.querySelector('.expand-icon');if(icon)icon.innerHTML='&#9660;';});
dept2Rows.forEach(r=>{if(r.querySelector('.expand-icon')){r.classList.add('expanded');const icon=r.querySelector('.expand-icon');if(icon)icon.innerHTML='&#9660;';}});
}
function collapseAll(){
const tb=document.getElementById('tblBody');
const dept2Rows=tb.querySelectorAll('.dept2-row');
const dept3Rows=tb.querySelectorAll('.dept3-row');
const buRows=tb.querySelectorAll('.bu-row');
dept2Rows.forEach(r=>r.classList.remove('show'));
dept3Rows.forEach(r=>r.classList.remove('show'));
buRows.forEach(r=>{r.classList.remove('expanded');const icon=r.querySelector('.expand-icon');if(icon)icon.innerHTML='&#9654;';});
dept2Rows.forEach(r=>{r.classList.remove('expanded');const icon=r.querySelector('.expand-icon');if(icon)icon.innerHTML='&#9654;';});
}
